<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MazitovaArt — Авторские картины и этно-живопись Вероники Мазитовой</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #FAF6F0;
    --primary:  #4A354F;
    --gold:     #B88738;
    --text:     #2D252E;
    --muted:    #6E6270;
    --border:   rgba(184, 135, 56, 0.25);
  }
  body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-weight: 300; line-height: 1.6; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 4rem; background: rgba(250, 246, 240, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .nav-brand { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; }
  .nav-logo-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--gold); }
  .nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 500; color: var(--primary); }
  #hero { min-height: 100vh; display: flex; align-items: center; padding: 7rem 4rem 3rem 4rem; }
  .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 4rem; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; }
  .hero-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.5rem, 4.8vw, 4.2rem); color: var(--primary); margin-bottom: 1.5rem; }
  .hero-title em { font-style: italic; color: var(--gold); }
  .hero-image-wrapper { position: relative; border: 1px solid var(--border); padding: 12px; background: #ffffff; box-shadow: 0 15px 35px rgba(110,98,112,0.15); }
  .hero-img { width: 100%; height: auto; display: block; }
  section { padding: 5rem 2rem; }
  .container { max-width: 1100px; margin: 0 auto; }
  .section-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.2rem, 3.8vw, 3rem); color: var(--primary); }
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.5rem; margin-top: 3rem; }
  .art-card { background: #ffffff; border: 1px solid var(--border); padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); }
  .art-img-box { position: relative; overflow: hidden; margin-bottom: 0.8rem; border: 1px solid var(--border); }
  .art-img { width: 100%; height: 320px; object-fit: cover; display: block; }
  .art-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 1rem; }
  .thumb-item { border: 2px solid var(--border); cursor: pointer; overflow: hidden; height: 60px; position: relative; }
  .thumb-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-item.active { border-color: var(--primary); }
  .thumb-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(74,53,79,0.85); color: #fff; font-size: 0.55rem; text-align: center; }
  .art-title { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; color: var(--primary); margin-bottom: 0.4rem; font-weight: 600; }
  footer { background: var(--primary); color: #ffffff; padding: 3rem 2rem; text-align: center; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="#hero">
    <img src="logo.png" alt="MazitovaArt" class="nav-logo-img" onerror="this.src='logo.png.jpg'">
    <span class="nav-logo">MazitovaArt</span>
  </a>
</nav>

<section id="hero">
  <div class="hero-grid">
    <div>
      <h1 class="hero-title">Картины в <em>этно-стиле</em>, которые оживают ночью</h1>
    </div>
    <div class="hero-image-wrapper">
      <img src="alga-day.jpg" alt="Алга, Кыргызстан!" class="hero-img" onerror="this.src='alga-day.jpg.jpg'">
    </div>
  </div>
</section>

<section id="gallery">
  <div class="container">
    <h2 class="section-title">Галерея шедевров</h2>
    <div class="gallery-grid">
      <!-- 0. АЛГА -->
      <div class="art-card">
        <div class="art-img-box">
          <img id="art-img-0" src="alga-day.jpg" alt="Алга, Кыргызстан!" class="art-img" onerror="this.src='alga-day.jpg.jpg'">
        </div>
        <div class="art-thumbs">
          <div class="thumb-item active" onclick="switchView(0, 'alga-day.jpg', 'alga-day.jpg.jpg', this)"><img src="alga-day.jpg" onerror="this.src='alga-day.jpg.jpg'"><span class="thumb-label">День</span></div>
          <div class="thumb-item" onclick="switchView(0, 'alga-night.jpg', 'alga-night.jpg.jpg', this)"><img src="alga-night.jpg" onerror="this.src='alga-night.jpg.jpg'"><span class="thumb-label">Ночь</span></div>
          <div class="thumb-item" onclick="switchView(0, 'alga-relief.jpg', 'alga-relief.jpg.jpg', this)"><img src="alga-relief.jpg" onerror="this.src='alga-relief.jpg.jpg'"><span class="thumb-label">Рельеф</span></div>
          <div class="thumb-item" onclick="switchView(0, 'alga-interior.jpg', 'alga-interior.jpg.jpg', this)"><img src="alga-interior.jpg" onerror="this.src='alga-interior.jpg.jpg'"><span class="thumb-label">Интерьер</span></div>
        </div>
        <h3 class="art-title">«Алга, Кыргызстан!»</h3>
      </div>
    </div>
  </div>
</section>

<footer>
  <p>© 2026 MazitovaArt · Вероника Мазитова</p>
</footer>

<script>
  function switchView(cardNum, primarySrc, fallbackSrc, thumbElement) {
    const img = document.getElementById('art-img-' + cardNum);
    img.src = primarySrc;
    img.onerror = function() { img.src = fallbackSrc; };
    
    const container = thumbElement.parentElement;
    const thumbs = container.getElementsByClassName('thumb-item');
    for (let t of thumbs) { t.classList.remove('active'); }
    thumbElement.classList.add('active');
  }
</script>
</body>
</html>
