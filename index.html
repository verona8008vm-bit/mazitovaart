<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mazitova Art Studio</title>

<style>
body { font-family: Arial; margin:0; background:#f9f9f9; color:#333; }
header { background:#ffe8d6; padding:40px; text-align:center; }
h1 { margin:0; }
.container { max-width:1100px; margin:auto; padding:20px; }
.cards { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
.card { background:white; width:250px; padding:15px; border-radius:12px; box-shadow:0 4px 8px rgba(0,0,0,0.1); }
.card img { width:100%; border-radius:8px; }
.price { font-weight:bold; margin-top:10px; }
.buy { display:inline-block; margin-top:10px; padding:8px 15px; background:#ff6b6b; color:white; text-decoration:none; border-radius:6px; }
.toggle { position:fixed; top:10px; right:10px; }
button { padding:5px 10px; margin-left:5px; cursor:pointer; }
footer { background:#eee; padding:20px; text-align:center; margin-top:40px; }
</style>
</head>

<body>

<div class="toggle">
<button onclick="setLang('ru')">RU</button>
<button onclick="setLang('en')">EN</button>
</div>

<header>
<h1>Mazitova Art Studio</h1>
<p id="subtitle">Авторские раскраски для детей и взрослых</p>
</header>

<div class="container">
<div class="cards" id="books-container"></div>
</div>

<footer>
<p>Telegram: <a href="https://t.me/raskraskimazitovaart" target="_blank">@raskraskimazitovaart</a></p>
<p>Instagram: <a href="https://www.instagram.com/mazitovaart" target="_blank">@mazitovaart</a></p>
<p>Email: mazitovaart@gmail.com</p>
</footer>

<script>
let currentLang = "ru";

function setLang(lang) {
  currentLang = lang;
  loadBooks();
  document.getElementById("subtitle").innerText =
    lang === "ru"
      ? "Авторские раскраски для детей и взрослых"
      : "Author Coloring Books for Kids & Adults";
}

function loadBooks() {
  fetch("books.json")
    .then(response => response.json())
    .then(data => {
      const container = document.getElementById("books-container");
      container.innerHTML = "";

      data.forEach(book => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = 
          <img src="${book.image}" alt="">
          <h3>${currentLang === "ru" ? book.title_ru : book.title_en}</h3>
          <p>${currentLang === "ru" ? book.description_ru : book.description_en}</p>
          <div class="price">${book.price}</div>
          <a class="buy" href="https://t.me/raskraskimazitovaart" target="_blank">
            ${currentLang === "ru" ? "Купить" : "Buy"}
          </a>
        ;

        container.appendChild(card);
      });
    });
}

loadBooks();
</script>

</body>
</html>p
